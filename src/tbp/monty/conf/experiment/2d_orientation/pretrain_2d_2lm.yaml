# @package _global_

# Learn the two logos (021_logo_tbp, 022_logo_numenta) in two 2D LMs at once,
# one per 2D patch, for the 2D voting experiments (eval_2d_vote*.yaml). Same
# pipeline as pretrain_2d, but both LMs are supervised and they are not part of
# a hierarchy. Runs in tangent mode on both ideas.
defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_2lm_2d
  - /monty/sensor_module: 2sm_2d_dist
  - /monty/connectivity: 2lm_2sm_vote
  - /environment: mujoco_dist_agent_2d_sensors2_256
  - /env_interface: train_cows_small_2d_children_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_2d_sensor3_256
  - /termination: any1_any_mfgm_t3e3exp1000_naivescan_fixed1_tot500
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 7
    n_eval_epochs: 7
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: pretrain_2d_2lm
