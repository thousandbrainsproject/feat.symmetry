# @package _global_

# eval_2d_vote under its idea 4 run name. On the idea4 branch the 2D SM always
# reports in world (world location and pose plus the tangent-to-world frame),
# and the LMs rotate their hypotheses with the frame, so no SM override is
# needed. On idea1 or main this is the same run as eval_2d_vote.
defaults:
  - /experiment/2d_orientation/eval_2d_vote

experiment:
  config:
    logging:
      run_name: eval_2d_vote_world
