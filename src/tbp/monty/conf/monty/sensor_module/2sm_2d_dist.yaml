# @package experiment.config.monty_config.sensor_modules

# Two copies of the 2D SM in 3sm_2d3d_dist_raw0 (sensor_module_1), one per
# patch, plus a plain view finder. For idea 4, set output_frame: world on
# both 2D SMs (see experiment/2d_orientation/eval_2d_vote_world.yaml).
sensor_module_0:
  _target_: tbp.monty.frameworks.models.two_d_sensor_module.TwoDSensorModule
  sensor_module_id: patch_0
  save_raw_obs: false
  edge_detector:
    _target_: tbp.monty.frameworks.utils.edge_detection.EdgeDetector
    gaussian_sigma: 1.0
    kernel_size: 7
    strength_threshold: 0.1
    coherence_threshold: 0.5
    radius: 14.0
    sigma_r: 7.0
    depth_edge_threshold: 0.01
    max_center_offset: null
  noise_params: null
  features:
    - pose_vectors
    - pose_fully_defined
    - principal_curvatures
    - on_object
    - object_coverage
    - rgba
    - hsv
    - edge_strength
    - coherence
    - mean_depth
    - min_depth
  delta_thresholds:
    on_object: 0
    n_steps: 20
    hsv:
      - 0.1
      - 0.1
      - 0.1
    pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
    distance: 0.01
sensor_module_1:
  _target_: tbp.monty.frameworks.models.two_d_sensor_module.TwoDSensorModule
  sensor_module_id: patch_1
  save_raw_obs: false
  edge_detector:
    _target_: tbp.monty.frameworks.utils.edge_detection.EdgeDetector
    gaussian_sigma: 1.0
    kernel_size: 7
    strength_threshold: 0.1
    coherence_threshold: 0.5
    radius: 14.0
    sigma_r: 7.0
    depth_edge_threshold: 0.01
    max_center_offset: null
  noise_params: null
  features:
    - pose_vectors
    - pose_fully_defined
    - principal_curvatures
    - on_object
    - object_coverage
    - rgba
    - hsv
    - edge_strength
    - coherence
    - mean_depth
    - min_depth
  delta_thresholds:
    on_object: 0
    n_steps: 20
    hsv:
      - 0.1
      - 0.1
      - 0.1
    pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
    distance: 0.01
sensor_module_2:
  _target_: tbp.monty.experiment.sensor_module.ExperimentSensorModule
  sensor_module_id: view_finder
  sensor_id: view_finder
  transforms: []
