# @package experiment.config.environment

# Same as gaussianblur_missing_depthto3d_sensor4_256, for the two 2D patches of
# mujoco_dist_agent_2d_sensors2_256 (both blurred, both zoom 30).
transform:
- _target_: tbp.monty.frameworks.environment_utils.transforms.GaussianBlurRGB
  agent_id: agent_id_0
  sigma: 5
  sensor_ids:
  - patch_0
  - patch_1
- _target_: tbp.monty.frameworks.environment_utils.transforms.MissingToMaxDepth
  agent_id: agent_id_0
  max_depth: 1
- _target_: tbp.monty.frameworks.environment_utils.transforms.DepthTo3DLocations
  agent_id: agent_id_0
  sensor_ids:
  - patch_0
  - patch_1
  - view_finder
  resolutions:
  - - 64
    - 64
  - - 64
    - 64
  - - 256
    - 256
  world_coord: true
  zooms:
  - 30.0
  - 30.0
  - 1.0
  get_all_points: true
  use_semantic_sensor: false
